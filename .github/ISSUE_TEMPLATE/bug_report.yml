name: Bug report
description: Something did not work as expected.
labels: [bug]
body:
  - type: input
    id: video
    attributes:
      label: Video id
      description: From the project URL, e.g. pagetovid.com/projects/<id>. Never paste an API key.
      placeholder: cm…
  - type: dropdown
    id: where
    attributes:
      label: Where did it happen?
      options: [Web app, MCP server, REST API, Browser extension, VS Code extension, Docs]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How can we reproduce it?
